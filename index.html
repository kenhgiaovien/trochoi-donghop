<!doctype html>
<html lang="vi">
<head>

<title>Đồng Hợp Smart Learning Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: a teacher's workbench (light, calm) around a chalkboard stage (dark, projector-sized) where games run. */
:root{
  --paper:#EEF2F7; --card:#FFFFFF; --ink:#1A2238; --muted:#5A6580; --line:#D3DAE6; --soft:#E3E9F2;
  --accent:#2B59D9; --accent-ink:#FFFFFF; --sun:#F3B53A; --coral:#E35D4B; --leaf:#2E9B63; --sky:#3C8DD8; --plum:#8A55C9;
  --ok:#23945A; --bad:#D2483A; --warn:#B7791F;
  --board:#1D4A3D; --board2:#163A30; --chalk:#F4F7F2; --chalk-dim:#BFD3C8;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141D; --card:#161F2B; --ink:#E6ECF5; --muted:#9AA6BC; --line:#2A3647; --soft:#1D2836;
  --accent:#6E93FF; --accent-ink:#0B1020; --sun:#F3BE55; --coral:#F07766; --leaf:#4CC285; --sky:#62A9EE; --plum:#AE85E8;
  --ok:#4CC285; --bad:#F07766; --warn:#E3B04B; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141D; --card:#161F2B; --ink:#E6ECF5; --muted:#9AA6BC; --line:#2A3647; --soft:#1D2836;
  --accent:#6E93FF; --accent-ink:#0B1020; --sun:#F3BE55; --coral:#F07766; --leaf:#4CC285; --sky:#62A9EE; --plum:#AE85E8;
  --ok:#4CC285; --bad:#F07766; --warn:#E3B04B; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,38px);font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.logo{width:40px;height:40px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.1;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{border:0;background:none;padding:7px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
nav.tabs button:hover{background:var(--soft);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--card)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
main{padding-block:22px 60px}
.view{display:grid;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2A1E00}
.btn.ghost{background:none;border-color:transparent}
.btn.big{padding:14px 22px;font-size:16px;border-radius:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f > span{text-transform:uppercase;letter-spacing:.04em;font-size:11.5px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 11px;color:var(--ink);font-weight:500;font-size:14.5px}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13.5px;line-height:1.55}
input:disabled{opacity:.7}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.adv{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
details.adv>summary{cursor:pointer;padding:14px 18px;font-weight:700;font-family:var(--f-display);font-size:17px}
details.adv>div{padding:0 18px 18px;display:grid;gap:14px}
.note{border-left:4px solid var(--sun);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.5px}
.note.bad{border-color:var(--bad)} .note.ok{border-color:var(--ok)}
.tabsbar{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabsbar button{border:1px solid var(--line);background:var(--card);border-radius:9px 9px 0 0;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.tabsbar button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tabsbar .n{font-size:11px;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.hero{display:grid;gap:16px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.door{display:grid;gap:10px;padding:22px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.door:hover{border-color:var(--ink)}
.door h2{font-size:26px}
.door.t{background:var(--board);color:var(--chalk);border-color:var(--board)}
.door.t .muted{color:var(--chalk-dim)}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi b{font-family:var(--f-display);font-size:30px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.door.t .kpi span{color:var(--chalk-dim)}
/* game library */
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;min-width:0}
.gcard:hover{border-color:var(--ink)}
.gcard[aria-disabled="true"]{opacity:.5}
.gcard b{display:block;font-size:14.5px;line-height:1.25}
.gcard small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:3px}
.gico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:#fff;letter-spacing:.02em}
.c-q{background:var(--accent)} .c-pairs{background:var(--leaf)} .c-words{background:var(--plum)} .c-seq{background:var(--sky)} .c-groups{background:var(--warn)} .c-tf{background:var(--coral)} .c-cloze{background:#4A6077} .c-tool{background:#6B5B45}
.gnum{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft)}
table.t td.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto;max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:10px;font-weight:600;z-index:100;box-shadow:var(--shadow);max-width:min(92vw,560px);text-align:center}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:10px;max-height:120px;overflow:auto;user-select:all}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.namegrid button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600}
.namegrid button:hover{border-color:var(--accent)}
.namegrid button small{color:var(--muted);font-weight:500;display:block;font-size:12px}
.filelist{display:grid;gap:6px;font-size:13px}
.filelist div{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.filelist span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ===== STAGE (games) ===== */
.stage{--s-bg:var(--board);--s-bg2:var(--board2);--s-fg:var(--chalk);--s-dim:var(--chalk-dim);--s-tile:rgba(255,255,255,.09);--s-tile2:rgba(255,255,255,.16);
  background:radial-gradient(120% 90% at 50% 0%,var(--s-bg) 0%,var(--s-bg2) 100%);color:var(--s-fg);border-radius:16px;min-height:min(78vh,760px);display:flex;flex-direction:column;overflow:hidden;position:relative;font-size:17px}
.stage[data-look="ocean"]{--s-bg:#1C4C80;--s-bg2:#0F2D52;--s-dim:#B9D2EE}
.stage[data-look="dusk"]{--s-bg:#5B2C6F;--s-bg2:#2B1538;--s-dim:#E3C6EE}
.stage[data-look="paper"]{--s-bg:#FBFCFE;--s-bg2:#E9EEF6;--s-fg:#1A2238;--s-dim:#5A6580;--s-tile:rgba(26,34,56,.06);--s-tile2:rgba(26,34,56,.12)}
.stage:fullscreen{border-radius:0;min-height:100vh}
.hud{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--s-tile2);flex-wrap:wrap}
.hud .t{font-family:var(--f-display);font-weight:700;font-size:19px;min-width:0;flex:1 1 200px}
.hud .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hb{background:var(--s-tile);border:1px solid var(--s-tile2);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--s-fg)}
button.hb{cursor:pointer}
.arena{flex:1;position:relative;padding:18px;display:flex;flex-direction:column;gap:16px;min-height:0}
.center{display:grid;place-items:center;text-align:center;gap:14px;flex:1}
.qcard{display:grid;gap:14px;width:100%;max-width:980px;margin:0 auto}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.8vw,32px);line-height:1.25;text-align:center;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid transparent;border-radius:14px;padding:14px 16px;cursor:pointer;font-weight:600;font-size:clamp(15px,1.7vw,20px);color:#fff;min-height:64px;line-height:1.3}
.opt .k{flex:none;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.opt:nth-child(4n+1){background:#C9473A}.opt:nth-child(4n+2){background:#2C62C9}.opt:nth-child(4n+3){background:#C28A12}.opt:nth-child(4n+4){background:#23885A}
.opt:hover{filter:brightness(1.1)}
.opt[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.opt.right{outline:4px solid #7CF2B0;filter:none} .opt.wrong{opacity:.45} .opt.dim{opacity:.35}
.opt:disabled{cursor:default}
.explain{background:var(--s-tile);border:1px solid var(--s-tile2);border-radius:12px;padding:12px 14px;font-size:15.5px}
.tbar{height:8px;border-radius:99px;background:var(--s-tile2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);width:100%;transition:width .25s linear}
.sbtn{border:1px solid var(--s-tile2);background:var(--s-tile);color:var(--s-fg);border-radius:12px;padding:11px 20px;cursor:pointer;font-weight:700;font-size:16px}
.sbtn:hover{background:var(--s-tile2)}
.sbtn.go{background:var(--sun);color:#2A1E00;border-color:var(--sun)}
.sbtn:disabled{opacity:.4;cursor:default}
.tile{background:var(--s-tile);border:1px solid var(--s-tile2);border-radius:12px;padding:10px 12px;color:var(--s-fg);cursor:pointer;font-weight:600;font-size:15.5px;text-align:center;line-height:1.3;user-select:none}
.tile:hover{background:var(--s-tile2)}
.tile.sel{outline:3px solid var(--sun)}
.tile.okc{background:rgba(46,155,99,.55);border-color:#7CF2B0}
.tile.badc{background:rgba(210,72,58,.55);border-color:#FF9C8F}
.tile.gone{visibility:hidden}
.tile.ph{border-style:dashed;color:var(--s-dim);cursor:pointer;font-weight:500}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.flt{position:absolute;padding:10px 14px;border-radius:16px;font-weight:700;cursor:pointer;color:#fff;text-align:center;max-width:220px;line-height:1.25;font-size:15px;user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.cells{display:grid;gap:3px;margin:0 auto;user-select:none}
.cell{width:var(--cs,34px);height:var(--cs,34px);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:calc(var(--cs,34px)*.55);border-radius:6px;background:var(--s-tile);border:1px solid var(--s-tile2);color:var(--s-fg)}
.cell.on{background:var(--s-fg);color:var(--s-bg2)}
.cell.key{background:var(--sun);color:#2A1E00}
.cell.hit{background:rgba(46,155,99,.7)}
.cell.cur{outline:2px solid var(--sun)}
.cell.void{background:none;border-color:transparent}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px;margin:0 auto}
.kb button{min-width:38px;height:42px;border-radius:8px;border:1px solid var(--s-tile2);background:var(--s-tile);color:var(--s-fg);font-weight:800;cursor:pointer;font-size:16px}
.kb button:disabled{opacity:.3}
.kb button.g{background:#23885A}.kb button.y{background:#C28A12}.kb button.x{opacity:.35}
.teams{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.team{border-radius:12px;padding:6px 14px;font-weight:800;background:var(--s-tile);border:2px solid transparent;font-variant-numeric:tabular-nums}
.team.on{border-color:var(--sun)}
.res{display:grid;gap:16px;max-width:860px;margin:0 auto;width:100%}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,9vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.revlist{display:grid;gap:6px;font-size:14.5px;max-height:36vh;overflow:auto;text-align:left}
.revlist div{background:var(--s-tile);border-radius:10px;padding:8px 12px;border-left:4px solid #7CF2B0}
.revlist div.x{border-left-color:#FF9C8F}
.dpad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center}
.dpad button{height:48px;border-radius:10px;border:1px solid var(--s-tile2);background:var(--s-tile);color:var(--s-fg);font-size:20px;cursor:pointer}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.legend div{background:var(--s-tile);border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px}
/* ===== Tạo nhanh (giáo viên) ===== */
.logo{border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--line)}
.setup{border:2px solid var(--sun)}
.quick{display:grid;gap:0;padding:0;overflow:hidden}
.qstep{display:flex;gap:14px;padding:18px;border-bottom:1px solid var(--line);align-items:flex-start}
.qstep:last-child{border-bottom:0;background:var(--soft)}
.qn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
select{min-height:40px}
a.btn{text-decoration:none;color:inherit}
/* ===== Giao diện học sinh ===== */
body.kidbg{background:linear-gradient(160deg,#FFF3D6 0%,#FFE1EC 45%,#DDEBFF 100%)}
:root[data-theme="dark"] body.kidbg{background:linear-gradient(160deg,#2A1B3D,#1B2A4A)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.kidbg{background:linear-gradient(160deg,#2A1B3D,#1B2A4A)}}
.kidhero{background:linear-gradient(120deg,#FF8A3D 0%,#F3476B 50%,#8A55C9 100%);color:#fff;border-radius:22px;padding:22px 24px;display:grid;gap:10px;box-shadow:0 8px 24px rgba(243,71,107,.25)}
.kidhero h1{font-size:clamp(26px,5vw,42px)}
.kpill{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 14px;font-weight:700;font-size:14px}
.kid .card{border:0;border-radius:20px;box-shadow:0 6px 20px rgba(60,40,120,.10)}
.kid h3{font-size:21px}
.bigpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.bigpick button{border:0;border-radius:18px;padding:18px 8px;font-family:var(--f-display);font-weight:800;font-size:24px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}

function readFileText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); }); }

async function extractText(file) {
  const name = file.name.toLowerCase();

  if (/\.(docx|pptx)$/.test(name)) {
    const JSZip = await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip');
    const zip = await JSZip.loadAsync(await readFileBuf(file));

      .sort((a, b) => (parseInt(a.match(/\d+/)) || 0) - (parseInt(b.match(/\d+/)) || 0));
    let out = '';
    for (const f of files) {
      const xml = await zip.file(f).async('string');
      out += (name.endsWith('.pptx') ? `\n[Slide ${f.match(/\d+/)[0]}]\n` : '') + xml.replace(/<\/w:p>|<\/a:p>/g, '\n').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
    }

  }
  if (name.endsWith('.pdf')) {
    await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', 'pdfjsWorker');
    const pdfjs = await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'pdfjsLib');
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await readFileBuf(file)) }).promise;

    return out;
  }
  throw new Error('Định dạng chưa hỗ trợ');
}

  const D = parsePack(p);
  const avail = GAMES.filter(g => g.kind !== 'tool' && COUNT(D, g.kind) >= g.min);
  const chosen = new Set(avail.filter(g => ['q1', 'q6', 'p2', 'w4', 't1', 's1', 'g1', 'c2'].includes(g.id)).map(g => g.id));
  let mode = p.purpose === 'Đánh giá' ? 'test' : 'practice';
  const cls = new Set(p.classes.filter(c => S.roster && S.roster.classes[c]));
  const out = h('div');
  const body = h('div', { class: 'view' });
  const gl = h('div', { class: 'chips' });
  avail.forEach(g => gl.append(h('button', { type: 'button', class: 'chip', 'aria-pressed': chosen.has(g.id), onclick: e => { chosen.has(g.id) ? chosen.delete(g.id) : chosen.add(g.id); e.target.setAttribute('aria-pressed', chosen.has(g.id)); } }, g.name)));

function parseCSV(text) {
  const rows = []; let cur = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',' || ch === ';' || ch === '\t') { cur.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; cur.push(f); rows.push(cur); cur = []; f = ''; }
    else f += ch;
  }
  if (f || cur.length) { cur.push(f); rows.push(cur); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}

  return out;
}

/* ===== Cài đặt AI Gemini ===== */
function aiSettingsCard() {
  const card = h('div', { class: 'card', id: 'ai', style: { display: 'grid', gap: '10px' } });
  if (!IS_WEB) {
    card.append(h('h3', null, 'Cài đặt AI'), h('p', { class: 'small' }, S.cloud.sample ? 'Bản này đang dùng Claude bằng tài khoản của thầy cô, không cần cài thêm.' : 'Nút AI của bản này dùng tài khoản Claude của người mở.'),
      h('p', { class: 'note' }, 'Muốn dùng Gemini miễn phí, thầy cô mở bản đăng trên GitHub của trường (bản claude.ai không kết nối được tới Gemini).'));
    return card;
  }
  const cfg = gemCfg();
  const key = h('input', { type: 'password', id: 'gem-key', autocomplete: 'off', placeholder: 'Dán khóa API Gemini (bắt đầu bằng AIza…)', value: cfg.key });
  const sel = h('select', { id: 'gem-model' }, cfg.model ? h('option', { value: cfg.model }, cfg.model) : h('option', { value: '' }, 'Tự chọn bản Flash miễn phí'));
  const msg = h('div');
  const say = (cls, text) => { msg.innerHTML = ''; msg.append(h('p', { class: 'note ' + cls }, text)); };
  async function test() {
    const k = key.value.trim(); if (!k) return say('bad', 'Chưa dán khóa.');
    say('', 'Đang kiểm tra khóa với Google…');
    try {
      const list = await gemModels(k); if (!list.length) return say('bad', 'Khóa đúng nhưng không có mô hình Gemini nào dùng được.');
      const def = pickDefaultModel(list); const cur = sel.value || def;
      sel.innerHTML = ''; list.forEach(m => sel.append(h('option', { value: m.id, selected: m.id === cur }, m.label + (m.id === def ? ' (đề xuất)' : ''))));
      LS.set('dh.gemini', { key: k, model: sel.value }); say('ok', 'Khóa hợp lệ, đã lưu trên máy này. Nút TẠO CÂU HỎI BẰNG AI đã sẵn sàng.');
    } catch (e) { say('bad', e.code === 'bad_key' ? 'Khóa không đúng hoặc đã bị xóa. Kiểm tra lại đã sao chép đủ chưa.' : e.code === 'rate_limited' ? 'Google đang giới hạn lượt — thử lại sau 1 phút.' : (e.message || 'Không kiểm tra được.')); }
  }
  card.append(h('h3', null, 'Cài đặt AI – Gemini miễn phí'),
    h('ol', { style: { margin: 0, paddingLeft: '20px', display: 'grid', gap: '4px' } },
      h('li', null, 'Mở trang ', h('a', { href: 'https://aistudio.google.com/apikey', target: '_blank', rel: 'noopener' }, 'aistudio.google.com/apikey'), ' và đăng nhập bằng Gmail của thầy cô.'),
      h('li', null, 'Bấm "Create API key" (Tạo khóa API). Nếu được hỏi, chọn tạo dự án mới. Không cần thẻ thanh toán.'),
      h('li', null, 'Bấm biểu tượng sao chép cạnh khóa vừa tạo.'),
      h('li', null, 'Dán vào ô dưới đây rồi bấm "Kiểm tra và lưu".')),
    h('div', { class: 'fgrid' }, h('label', { class: 'f' }, h('span', null, 'Khóa API Gemini'), key), h('label', { class: 'f' }, h('span', null, 'Mô hình'), sel)),
    h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: test }, 'Kiểm tra và lưu'),
      h('button', { class: 'btn', onclick: () => { key.type = key.type === 'password' ? 'text' : 'password'; } }, 'Hiện/ẩn khóa'),
      cfg.key ? h('button', { class: 'btn danger', onclick: () => { LS.set('dh.gemini', { key: '', model: '' }); render(); toast('Đã xóa khóa khỏi máy này'); } }, 'Xóa khóa') : null),
    msg,
    h('p', { class: 'small muted' }, 'Khóa chỉ lưu trong trình duyệt của máy này, không gửi cho ai khác ngoài Google. Không chia sẻ khóa cho người khác. Gói miễn phí có giới hạn lượt mỗi phút/mỗi ngày; Google có thể dùng nội dung gửi lên để cải thiện dịch vụ, nên chỉ tải tài liệu bài học, không tải tài liệu có thông tin cá nhân học sinh.'));
  sel.onchange = () => { const c = gemCfg(); if (c.key) LS.set('dh.gemini', Object.assign(c, { model: sel.value })); };
  if (cfg.key) say('ok', 'Đã có khóa trên máy này' + (cfg.model ? ' · mô hình ' + cfg.model : '') + '.');
  return card;
}

/* ===== Khởi động ===== */
async function boot() {
  $('#brand').addEventListener('click', () => { if (!S.shared) go('home'); });
  const hash = location.hash.slice(1);
  if (hash && /^g-/.test(hash)) {
    try { S.shared = await parseAnyCode(hash); S.view = 'join'; } catch (e) { S.view = 'home'; toast('Đường link bị thiếu hoặc lỗi — xin thầy cô gửi lại'); }
  }
  render(); renderPill();
  initCloud();
}

/* --- Kho tài liệu (IndexedDB: tải lên một lần, dùng mãi trên máy này) --- */
let _idb = null; const MEM_MAT = [];
function idb() {
  if (_idb) return _idb;
  _idb = new Promise(res => { try { const r = indexedDB.open('dh-kho', 1); r.onupgradeneeded = () => r.result.createObjectStore('mat', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } });
  return _idb;
}
async function matAll() { const db = await idb(); if (!db) return MEM_MAT; return new Promise(res => { try { const q = db.transaction('mat').objectStore('mat').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } }); }
async function matPut(m) { const db = await idb(); if (!db) { MEM_MAT.push(m); return; } return new Promise(res => { const tx = db.transaction('mat', 'readwrite'); tx.objectStore('mat').put(m); tx.oncomplete = res; tx.onerror = res; }); }
async function matDel(id) { const db = await idb(); if (!db) { const k = MEM_MAT.findIndex(x => x.id === id); if (k >= 0) MEM_MAT.splice(k, 1); return; } return new Promise(res => { const tx = db.transaction('mat', 'readwrite'); tx.objectStore('mat').delete(id); tx.oncomplete = res; tx.onerror = res; }); }
const lessonNo = s => { const m = String(s || '').match(/(?:bài|chủ đề|unit)\s*(\d+)/i); return m ? +m[1] : null; };
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function excerptFor(text, lesson, max) {
  const low = text.toLowerCase(), no = lessonNo(lesson);
  const bare = lesson.replace(/^\s*(bài|chủ đề|unit)\s*\d+\s*[.:\-–]?\s*/i, '').trim().toLowerCase();
  const pats = [];
  if (bare.length >= 6) pats.push(new RegExp(reEsc(bare).replace(/\s+/g, '\\s+'), 'g'));
  if (no != null) pats.push(new RegExp('(?:bài|chủ đề|unit)\\s*' + no + '(?!\\d)', 'g'));
  let hits = [];
  for (const re of pats) { let m; while ((m = re.exec(low)) && hits.length < 40) hits.push(m.index); if (hits.length) break; }
  if (!hits.length) return '';
  const dense = i => new Set(low.slice(i, i + 1200).match(/(?:bài|chủ đề|unit)\s*\d+/g) || []).size;
  const found = hits.find(i => dense(i) < 4);
  const start = found != null ? found : hits[hits.length - 1];
  let end = start + max;
  if (no != null) { const nx = low.slice(start + 200).search(new RegExp('\\n\\s*(?:bài|chủ đề|unit)\\s*' + (no + 1) + '(?!\\d)')); if (nx > 0) end = Math.min(end, start + 200 + nx); }
  return text.slice(Math.max(0, start - 80), end);
}
async function gatherMaterial(pk) {
  const mats = (await matAll()).filter(m => (!m.subject || !pk.subject || m.subject === pk.subject) && (!m.grade || !pk.grade || String(m.grade) === String(pk.grade)));
  const lesson = pk.lesson || pk.title || ''; const out = [], used = []; let room = 36000;
  for (const m of mats) {
    if (room < 2000) break;
    let ex = excerptFor(m.text, lesson, Math.min(room, 26000));
    if (!ex && m.text.length <= 40000) {
      const no = lessonNo(lesson), nm = plain(m.name), key = plain(lesson.replace(/^\s*bài\s*\d+\s*[.:]?/i, '')).slice(0, 12);
      if ((no != null && new RegExp('BAI0*' + no + '(?!\\d)').test(nm)) || (key.length > 5 && nm.includes(key))) ex = m.text.slice(0, room);
    }
    if (ex) { out.push('=== ' + (m.kind || 'Tài liệu') + ': ' + m.name + ' ===\n' + ex); used.push(m.name); room -= ex.length; }
  }
  return { texts: out.join('\n\n'), used, total: mats.length };
}

const ppKey = (s, g) => (s || '') + '|' + (g || '');
function lessonsFromRows(rows) {
  const out = [], seen = new Set(); let tietCol = -1;
  const isTitle = c => /^(bài|chủ đề|unit|chuyên đề)\s*\d+/i.test(c) && c.length > 5 && c.length < 170;

/* --- Danh sách bài tự rút từ sách trong Kho tài liệu --- */
function lessonsFromText(text) {
  const out = new Map(), re = /(?:^|[\s.])(?:Bài|BÀI)\s+(\d{1,2})\s*[.:]\s*([^\n]{4,110})/g; let m;
  while ((m = re.exec(text)) && out.size < 150) {
    let t = m[2].split(/\s{2,}|\s*\.{3,}|\s+(?:Bài|BÀI)\s+\d|\s+\d{1,3}(?=\s|$)/)[0].trim().replace(/[.\s…]+$/, '');
    if (t.length < 4 || !/\p{L}{2}/u.test(t)) continue;
    if (t === t.toUpperCase()) t = t[0] + t.slice(1).toLowerCase();
    const key = m[1] + '|' + norm(t); if (!out.has(key)) out.set(key, { t: 'Bài ' + m[1] + '. ' + t, n: 1 });
  }
  return [...out.values()];
}

  });

}

/* --- Sách PDF dạng ảnh scan: lưu cả tệp, khi tạo bài thì lấy ảnh đúng các trang của bài --- */
async function pdfDoc(blob) {
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', 'pdfjsWorker');
  const pdfjs = await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'pdfjsLib');
  return pdfjs.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
}
async function scanInfo(blob) {
  const doc = await pdfDoc(blob), outline = [];
  try { const ol = await doc.getOutline(); for (const it of (ol || []).flatMap(x => [x].concat(x.items || []))) { let d = it.dest; if (typeof d === 'string') d = await doc.getDestination(d); if (d && d[0]) outline.push({ t: it.title, p: (await doc.getPageIndex(d[0])) + 1 }); } } catch (e) { }
  return { pages: doc.numPages, outline };
}
async function renderPages(blob, from, to, width) {
  const doc = await pdfDoc(blob), out = [];
  for (let p = Math.max(1, from); p <= Math.min(to, doc.numPages, from + 7); p++) {
    const pg = await doc.getPage(p), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: (width || 1100) / v0.width });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise; out.push(cv);
  }
  return out;
}
const parsePages = s => { const m = String(s || '').match(/(\d+)\s*(?:[-–—]|đến|den|to)?\s*(\d+)?/i); if (!m) return null; const a = +m[1], b = m[2] ? +m[2] : a; return a > 0 && b >= a ? [a, b] : null; };
const cvBlob = (cv, type, q) => new Promise(res => cv.toBlob(res, type || 'image/jpeg', q || .82));
async function scanImages(pk) {
  const rg = parsePages(pk.pages); if (!rg) return [];
  const mats = (await matAll()).filter(m => m.scan && m.blob && m.subject === pk.subject && String(m.grade) === String(pk.grade));
  const out = [];
  for (const m of mats.slice(0, 1)) for (const cv of await renderPages(m.blob, rg[0], rg[1])) out.push(await cvBlob(cv));

}
async function stitchImages(blobs) {
  const bms = []; for (const b of blobs) bms.push(await createImageBitmap(b));
  const W = 900, hs = bms.map(b => Math.round(b.height * W / b.width)), cv = document.createElement('canvas');
  cv.width = W; cv.height = hs.reduce((a, b) => a + b, 0); const x = cv.getContext('2d'); let y = 0;
  bms.forEach((b, i) => { x.drawImage(b, 0, y, W, hs[i]); y += hs[i]; });

}
async function addToKho(file, subject, grade, kind) {
  const isPdf = /\.pdf$/i.test(file.name); let text = '';

}
function guessPages(outline, lesson) {
  const no = lessonNo(lesson), bare = norm(lesson.replace(/^\s*(bài|chủ đề|unit)\s*\d+\s*[.:\-–]?\s*/i, ''));
  const i = (outline || []).findIndex(o => (no != null && lessonNo(o.t) === no) || (bare.length > 5 && norm(o.t).includes(bare)));

/* --- Đọc câu hỏi dán thô: "Câu 1: ...  A. ...  B. ...  Đáp án: A" --- */
function parsePlainQuiz(text) {
  const blocks = ('\n' + String(text).replace(/\r/g, '')).split(/\n(?=\s*(?:\*\*)?(?:Câu|Question)\s*\d+\s*[.:)])|\n(?=\s*\d+\s*[.)]\s+\S)/i), out = [];
  for (const b of blocks) {
    const lines = b.split('\n').map(s => s.replace(/\*\*/g, '').trim()).filter(Boolean); if (lines.length < 3) continue;
    let q = '', ex = ''; const opts = []; let ans = [];
    for (const ln of lines) {
      let m;
      if ((m = ln.match(/^(?:đáp án đúng|đáp án|answer|đ\/a)\s*[:\-–]?\s*(.+)$/i))) { const lead = (m[1].match(/^\s*([A-H](?:\s*(?:,|;|và)\s*[A-H])*)(?![a-zà-ỹ])/) || [])[1] || ''; (lead.match(/[A-H]/g) || []).forEach(ch => ans.push(ch.charCodeAt(0) - 65)); const rest = m[1].slice(lead.length).replace(/^[\s.,;:\-–]+/, ''); if (rest.length > 3) ex = rest; }
      else if ((m = ln.match(/^(\*?)\s*([A-Ha-h])\s*[.)]\s*(.+)$/))) { if (m[1] || /\*\s*$/.test(m[3])) ans.push(opts.length); opts.push(m[3].replace(/\*\s*$/, '').trim()); }
      else if ((m = ln.match(/^(?:giải thích|lời giải)\s*[:\-–]\s*(.+)$/i))) ex = m[1];
      else if (!opts.length) q += (q ? ' ' : '') + ln.replace(/^(?:Câu|Question)?\s*\d+\s*[.:)]\s*/i, '');
    }
    ans = [...new Set(ans)].filter(i => i < opts.length);
    if (q && opts.length >= 2 && ans.length) out.push({ q, options: opts, correct: ans, explain: ex });
  }
  return out;
}
function readPasted(text) {
  try { const o = parseLooseJSON(text); if (o && typeof o === 'object' && !Array.isArray(o)) return o; if (Array.isArray(o) && o.length && o[0].q) return { q: o }; } catch (e) { }
  const q = parsePlainQuiz(text); if (q.length) return { q };
  const p = parseQ(text); if (p.list.length) return { q: p.list.map(x => ({ q: x.q, options: x.opts, correct: x.ans, explain: x.ex })) };
  return null;
}

    return names.map((name, i) => {
      const row = [i + 1, name, c];
      (titles.length ? titles : [null]).forEach(t => {
        const mine = rs.filter(r => r.cls === c && (!t || r.title === t) && (r.stt && S.roster ? r.stt === i + 1 : r.name === name));

const COLORS = ['#E35D4B', '#3C8DD8', '#F3B53A', '#2E9B63', '#8A55C9', '#E07BB0', '#4FB8B0', '#C98A3A'];
function qSeries(c, fn) {
  let i = 0; const qs = c.qs;
  const step = () => { if (c.ended) return; if (i >= qs.length) return c.end(); c.hud({ progress: `Câu ${i + 1}/${qs.length}` }); fn(qs[i], i++, step); };
  step();
}
const singleQs = c => c.qs.filter(q => q.ans.length === 1);
function splitArena(c, cols = 'minmax(0,1fr) minmax(0,2.2fr)') {
  const side = h('div', { style: { display: 'grid', gap: '10px', alignContent: 'start', minWidth: 0 } }), main = h('div', { style: { minWidth: 0, display: 'grid', alignContent: 'start' } });
  c.arena.append(h('div', { style: { display: 'grid', gridTemplateColumns: window.innerWidth < 720 ? '1fr' : cols, gap: '16px', flex: 1 } }, side, main));
  return { side, main };
}
function playfield(c, hgt = 430) { const f = h('div', { style: { position: 'relative', flex: 1, minHeight: hgt + 'px', overflow: 'hidden', borderRadius: '14px', background: 'var(--s-tile)' } }); return f; }
function qHeader(q, extra) { return h('div', { class: 'qtext', style: { fontSize: 'clamp(18px,2.3vw,28px)' } }, q.q, extra || null); }
function quickFeedback(c, ok, q, then, ms = 1300) {
  const right = q.ans.map(i => q.opts[i]).join('; ');
  const note = h('div', { class: 'explain pop', style: { position: 'absolute', left: '50%', top: '40%', transform: 'translateX(-50%)', zIndex: 5, textAlign: 'center', minWidth: '260px', background: 'var(--s-bg2)' } }, c.fb() ? (ok ? 'Chính xác!' : 'Đáp án đúng: ' + right) : 'Đã ghi nhận');
  sfx(c.fb() ? (ok ? 'ok' : 'bad') : 'pop');
  return note;
}

defGame({ id: 'q1', kind: 'q', name: 'Trắc nghiệm nhanh', ab: 'TN', min: 1, desc: 'Lần lượt từng câu, có giờ và giải thích.', how: 'Đọc câu hỏi và chọn đáp án (bấm hoặc phím 1–4). Câu nhiều đáp án: chọn hết rồi bấm Chốt.',
  play(c) { let ok = 0; qSeries(c, (q, i, next) => c.askQ(c.arena, q, r => { if (r) ok++; c.hud({ points: 'Đúng ' + ok }); next(); })); } });

defGame({ id: 'q2', kind: 'q', name: 'Đường đua tri thức', ab: 'ĐĐ', team: true, desc: 'Mỗi câu đúng xe tiến một chặng. Về đích trước thì thắng.', how: 'Trả lời đúng để xe tiến lên. Chơi đội: các đội lần lượt trả lời, đội về đích trước thắng.',
  play(c) {
    const T = c.teams || [{ name: c.student ? S.student.label : 'Em', score: 0 }];
    const goal = c.teams ? Math.max(3, Math.floor(c.qs.length / T.length)) : c.qs.length;
    const track = h('div', { style: { display: 'grid', gap: '8px' } }), qb = h('div');
    c.arena.append(track, qb);
    const draw = () => { track.innerHTML = ''; T.forEach((t, i) => { const fr = Math.min(1, t.score / goal); track.append(h('div', { style: { position: 'relative', height: '46px', background: 'var(--s-tile)', borderRadius: '10px', border: c.teams && i === c.turn ? '2px solid var(--sun)' : '1px solid var(--s-tile2)' } },
      h('span', { style: { position: 'absolute', left: '10px', top: '12px', fontWeight: 700, fontSize: '14px' } }, t.name + ' · ' + t.score),
      h('div', { style: { position: 'absolute', right: '10px', top: 0, bottom: 0, width: '8px', background: 'repeating-linear-gradient(#fff 0 6px,#222 6px 12px)' } }),
      h('div', { style: { position: 'absolute', top: '10px', left: `calc(110px + (100% - 180px) * ${fr})`, transition: 'left .7s', width: '48px', height: '26px', borderRadius: '8px 16px 6px 6px', background: COLORS[i], boxShadow: '8px 13px 0 -8px #111, 34px 13px 0 -8px #111' } }))); }); };
    draw();
    qSeries(c, (q, i, next) => c.askQ(qb, q, ok => {
      const t = T[c.turn]; if (ok) t.score++; draw();
      if (t.score >= goal) return c.end(c.teams ? {} : { title: 'VỀ ĐÍCH!' });

defGame({ id: 'q3', kind: 'q', name: 'Leo tháp', ab: 'LT', desc: 'Đúng thì xây thêm tầng, sai thì tháp mất một tầng.', how: 'Mỗi câu đúng tháp cao thêm một tầng; câu sai làm rơi tầng trên cùng. Xây tháp cao nhất có thể!',
  play(c) {
    const { side, main } = splitArena(c); let floors = 0, best = 0;
    const tower = h('div', { style: { display: 'flex', flexDirection: 'column-reverse', alignItems: 'center', gap: '3px', minHeight: '320px', justifyContent: 'flex-start', paddingTop: '10px' } });
    const lab = h('div', { class: 'hb', style: { justifySelf: 'center' } });
    side.append(lab, tower);
    const draw = () => { tower.innerHTML = ''; tower.append(h('div', { style: { width: '170px', height: '12px', background: '#6b5b45', borderRadius: '4px' } })); for (let i = 0; i < floors; i++) tower.append(h('div', { class: i === floors - 1 ? 'pop' : '', style: { width: (150 - i * 4) + 'px', height: '24px', borderRadius: '5px', background: COLORS[i % COLORS.length] } })); lab.textContent = `Tháp: ${floors} tầng · Cao nhất: ${best}`; };

defGame({ id: 'q4', kind: 'q', name: 'Vòng quay may mắn', ab: 'VQ', team: true, desc: 'Quay vòng chọn số điểm rồi trả lời câu hỏi để giành điểm.', how: 'Bấm QUAY để chọn mức điểm, sau đó trả lời câu hỏi. Ô "Mất lượt" chuyển lượt cho đội khác.',
  play(c) {
    const segs = [10, 20, 30, 50, 'Mất lượt', 20, 40, 100, 10, 'x2'];
    const T = c.teams || [{ name: 'Điểm', score: 0 }];
    const { side, main } = splitArena(c, 'minmax(0,1fr) minmax(0,1.6fr)');
    const cv = h('canvas', { width: 600, height: 600, style: { width: '100%', maxWidth: '330px', transition: 'transform 3.2s cubic-bezier(.17,.67,.2,1)', justifySelf: 'center' } });
    const pin = h('div', { style: { justifySelf: 'center', width: 0, height: 0, borderLeft: '14px solid transparent', borderRight: '14px solid transparent', borderTop: '24px solid var(--sun)', marginBottom: '-18px', zIndex: 2 } });
    const tb = h('div'); side.append(tb, pin, cv);
    const x = cv.getContext('2d'), n = segs.length, R = 290;
    for (let i = 0; i < n; i++) { x.beginPath(); x.moveTo(300, 300); x.arc(300, 300, R, (i / n) * 2 * Math.PI - Math.PI / 2, ((i + 1) / n) * 2 * Math.PI - Math.PI / 2); x.fillStyle = COLORS[i % COLORS.length]; x.fill(); x.save(); x.translate(300, 300); x.rotate(((i + .5) / n) * 2 * Math.PI - Math.PI / 2); x.fillStyle = '#fff'; x.font = 'bold 34px "Baloo 2", sans-serif'; x.textAlign = 'right'; x.fillText(String(segs[i]), R - 20, 12); x.restore(); }
    x.beginPath(); x.arc(300, 300, 40, 0, 7); x.fillStyle = '#fff'; x.fill();
    let rot = 0, qi = 0; const pool = c.qs;
    const draw = () => { c.teamBar(tb); c.hud({ progress: `Câu ${Math.min(qi + 1, pool.length)}/${pool.length}`, points: c.teams ? null : 'Điểm ' + T[0].score }); };
    const turn = () => {
      if (qi >= pool.length) return c.end();
      draw(); main.innerHTML = '';
      main.append(h('div', { class: 'center' }, h('h2', null, c.teams ? 'Lượt của ' + T[c.turn].name : 'Sẵn sàng?'), h('button', { class: 'sbtn go', style: { fontSize: '22px', padding: '14px 36px' }, onclick: e => {
        e.target.disabled = true; const k = Math.random() * n | 0; rot += 360 * 5 + (360 - (k + .5) * 360 / n) - (rot % 360); cv.style.transform = `rotate(${rot}deg)`;
        const tk = c.every(140, () => sfx('spin'));
        c.after(3300, () => {
          tk(); const v = segs[k];
          if (v === 'Mất lượt') { toast('Mất lượt!'); sfx('bad'); c.nextTurn(); return turn(); }
          const pts = v === 'x2' ? 'x2' : v;
          c.askQ(main, pool[qi++], ok => { const t = T[c.turn]; if (ok) t.score = pts === 'x2' ? Math.max(t.score * 2, 20) : t.score + pts; c.nextTurn(); turn(); }, { label: (c.teams ? T[c.turn].name + ' · ' : '') + 'Giá trị: ' + (pts === 'x2' ? 'nhân đôi điểm' : pts + ' điểm') });
        });
      } }, 'QUAY')));
    };

  } });

defGame({ id: 'q5', kind: 'q', name: 'Ô cửa bí mật', ab: 'ÔC', team: true, desc: 'Chọn ô cửa để mở câu hỏi; có ô ngôi sao nhân đôi và ô quà may mắn.', how: 'Chọn một ô cửa. Phía sau là câu hỏi (10 điểm), ngôi sao (20 điểm) hoặc quà may mắn (cộng ngay 10 điểm).',

defGame({ id: 'q6', kind: 'q', name: 'Nổ bóng bay', ab: 'BB', desc: 'Bóng bay mang đáp án bay lên, bấm nổ quả đúng.', how: 'Đọc câu hỏi rồi bấm vào quả bóng mang đáp án đúng trước khi hết giờ.',
  play(c) {

    qSeries(c, (q, i, next) => {
      c.arena.innerHTML = ''; const f = playfield(c); const tb = h('div', { class: 'tbar' }, h('i'));
      c.arena.append(qHeader(q), tb, f);
      let done = false; const W = () => f.clientWidth || 800, H = () => f.clientHeight || 430;
      const bs = q.opts.map((t, k) => { const el = h('div', { class: 'flt', style: { background: COLORS[k % 4 === 0 ? 0 : k], borderRadius: '50% 50% 46% 46% / 55% 55% 45% 45%', padding: '18px 16px', minWidth: '110px' } }, t); f.append(el); return { el, k, x: 0, y: 0, v: rnd(40, 70), ph: Math.random() * 6 }; });
      bs.forEach((b, k) => { b.x = (k + .5) * W() / bs.length - 60; b.y = H() + rnd(0, 200); });
      const finish = k => { if (done) return; done = true; tm.stop(); const r = k != null && q.ans.includes(k); c.record(r, q.q, k == null ? '(hết giờ)' : q.opts[k], q.ans.map(a => q.opts[a]).join('; ')); if (r) ok++; c.hud({ points: 'Đúng ' + ok }); if (k != null) bs[k].el.style.visibility = 'hidden'; f.append(quickFeedback(c, r, q)); c.after(1400, next); };
      bs.forEach(b => b.el.addEventListener('pointerdown', () => finish(b.k)));

      c.loop(dt => { if (done) return false; bs.forEach(b => { b.y -= b.v * dt; b.ph += dt; if (b.y < -90) b.y = H() + 20; b.el.style.transform = `translate(${b.x + Math.sin(b.ph) * 14}px,${b.y}px)`; }); });

defGame({ id: 'q7', kind: 'q', name: 'Đập chuột', ab: 'ĐC', desc: 'Chuột chui lên mang đáp án, đập đúng con mang đáp án đúng.', how: 'Các chú chuột lần lượt ngoi lên kèm đáp án. Bấm thật nhanh vào chú mang đáp án đúng.',
  play(c) {
    let ok = 0;
    qSeries(c, (q, i, next) => {
      c.arena.innerHTML = ''; const tb = h('div', { class: 'tbar' }, h('i'));
      const holes = Array.from({ length: 6 }, () => h('div', { style: { height: '120px', borderRadius: '50%/40%', background: 'radial-gradient(ellipse at 50% 70%,#2b1d12 55%,#5b3a1a 56%)', position: 'relative', overflow: 'hidden' } }));
      c.arena.append(qHeader(q), tb, h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '16px', maxWidth: '760px', width: '100%', margin: '0 auto' } }, holes));
      let done = false, cnt = 0;
      const finish = k => { if (done) return; done = true; tm.stop(); const r = k != null && q.ans.includes(k); c.record(r, q.q, k == null ? '(hết giờ)' : q.opts[k], q.ans.map(a => q.opts[a]).join('; ')); if (r) ok++; c.hud({ points: 'Đúng ' + ok }); const n = quickFeedback(c, r, q); c.arena.style.position = 'relative'; c.arena.append(n); c.after(1400, next); };
      const pop = () => {
        if (done) return;
        const free = holes.filter(x => !x.firstChild); if (!free.length) return;
        const hole = pick(free); cnt++;
        const k = cnt % 3 === 0 ? q.ans[0] : Math.random() * q.opts.length | 0;
        const m = h('div', { style: { position: 'absolute', left: '8%', right: '8%', bottom: '-100%', top: '12%', background: '#9b7653', borderRadius: '45% 45% 10% 10%', color: '#fff', display: 'grid', placeItems: 'center', textAlign: 'center', padding: '6px', fontWeight: 700, fontSize: '14px', transition: 'bottom .18s', cursor: 'pointer', lineHeight: 1.2 } }, q.opts[k]);
        m.addEventListener('pointerdown', () => { m.style.background = '#c9473a'; finish(k); });
        hole.append(m); requestAnimationFrame(() => m.style.bottom = '0');
        c.after(1500, () => { m.style.bottom = '-100%'; c.after(200, () => m.remove()); });
      };
      const tm = c.countdown(Math.max(c.time || 20, 12), tb, () => finish(null));
      pop(); c.every(700, pop);
    });
  } });

defGame({ id: 'q8', kind: 'q', name: 'Câu cá', ab: 'CC', desc: 'Canh thời điểm thả câu để bắt chú cá mang đáp án đúng.', how: 'Cá bơi qua lại dưới cần câu. Bấm THẢ CÂU (hoặc phím cách) đúng lúc cá mang đáp án đúng ở ngay dưới lưỡi câu.',
  play(c) {
    let ok = 0;
    qSeries(c, (q, i, next) => {
      c.arena.innerHTML = ''; const f = playfield(c, 400); f.style.background = 'linear-gradient(#2c6fa8,#123a5c)';
      const tb = h('div', { class: 'tbar' }, h('i'));

      c.arena.append(qHeader(q), tb, f, h('div', { style: { textAlign: 'center' } }, btn)); f.append(line);
      const lanes = q.opts.length, W = () => f.clientWidth || 800, H = () => f.clientHeight || 400;
      const fish = q.opts.map((t, k) => { const dir = k % 2 ? -1 : 1; const el = h('div', { class: 'flt', style: { background: COLORS[(k + 1) % 8], borderRadius: dir > 0 ? '40% 60% 60% 40%' : '60% 40% 40% 60%', cursor: 'default' } }, t); f.append(el); return { el, k, dir, x: rnd(0, W()), v: rnd(70, 120), y: 70 + k * ((H() - 110) / lanes) }; });
      let done = false, busy = false;
      const finish = k => { if (done) return; done = true; tm.stop(); const r = k != null && q.ans.includes(k); c.record(r, q.q, k == null ? '(hết giờ)' : q.opts[k], q.ans.map(a => q.opts[a]).join('; ')); if (r) ok++; c.hud({ points: 'Đúng ' + ok }); f.append(quickFeedback(c, r, q)); c.after(1400, next); };

      const tm = c.countdown(Math.max(c.time || 20, 15), tb, () => finish(null));
      c.loop(dt => { if (done) return false; fish.forEach(fi => { fi.x += fi.dir * fi.v * dt; const w = fi.el.offsetWidth; if (fi.x > W()) fi.x = -w; if (fi.x < -w) fi.x = W(); fi.el.style.transform = `translate(${fi.x}px,${fi.y}px)`; }); });
    });
  } });

defGame({ id: 'q9', kind: 'q', name: 'Máy bay đáp án', ab: 'MB', desc: 'Lái máy bay bay qua cổng mang đáp án đúng.', how: 'Dùng phím ↑ ↓ hoặc bấm vào làn bay để điều khiển máy bay đi qua cổng có đáp án đúng.',

      box.append(tb, pic, h('div', { class: 'row', style: { justifyContent: 'center', marginTop: '10px' } }, guess, h('button', { class: 'sbtn go', onclick: () => { if (plain(guess.value) === key) { sfx('win'); T[c.turn].score += 50; finishAll(true); } else { sfx('bad'); toast('Chưa đúng!'); c.nextTurn(); draw(); } } }, 'Đoán từ khóa')));
      if (tiles.every(t => t.open || t.locked)) c.after(600, () => !over && finishAll(false));
    };
    const openT = t => { box.innerHTML = ''; c.askQ(qb, t.q, ok => { if (ok) { t.open = true; T[c.turn].score += 10; } else t.locked = true; c.nextTurn(); draw(); }, { label: c.teams ? 'Lượt: ' + T[c.turn].name : null }); };

defGame({ id: 'q16', kind: 'q', name: 'Bingo tri thức', ab: 'BG', min: 9, desc: 'Tìm đáp án trên bảng bingo, đủ hàng ngang, dọc, chéo là BINGO.', how: 'Mỗi lượt hiện một câu hỏi. Bấm vào ô trên bảng có đáp án đúng. Đủ một hàng ngang, dọc hoặc chéo là BINGO!',
  play(c) {
    const uniq = []; const seen = new Set(); singleQs(c).forEach(q => { const a = q.opts[q.ans[0]]; if (!seen.has(norm(a))) { seen.add(norm(a)); uniq.push(q); } });
    const sz = uniq.length >= 16 ? 4 : 3; if (uniq.length < 9) { c.arena.append(h('div', { class: 'center' }, 'Cần ít nhất 9 câu một đáp án với đáp án khác nhau.')); return; }
    const cellQ = shuffle(uniq).slice(0, sz * sz); const order = shuffle(cellQ); const state = cellQ.map(() => 0);
    const grid = h('div', { style: { display: 'grid', gridTemplateColumns: `repeat(${sz},1fr)`, gap: '8px', maxWidth: '760px', width: '100%', margin: '0 auto' } });
    const qb = h('div', { class: 'qtext' }); const tb = h('div', { class: 'tbar', style: { maxWidth: '760px', margin: '0 auto', width: '100%' } }, h('i'));
    c.arena.append(qb, tb, grid);
    let i = 0, lines = 0, tm = null, busy = false;
    const countLines = () => { const L = []; for (let r = 0; r < sz; r++) { L.push([...Array(sz)].map((_, k) => r * sz + k)); L.push([...Array(sz)].map((_, k) => k * sz + r)); } L.push([...Array(sz)].map((_, k) => k * sz + k)); L.push([...Array(sz)].map((_, k) => k * sz + sz - 1 - k)); return L.filter(l => l.every(x => state[x] === 1)).length; };
    const draw = () => { grid.innerHTML = ''; cellQ.forEach((q, k) => grid.append(h('button', { class: 'tile' + (state[k] === 1 ? ' okc' : state[k] === 2 ? ' badc' : ''), style: { minHeight: '84px', fontSize: '15px' }, disabled: !!state[k], onclick: () => choose(k) }, q.opts[q.ans[0]]))); };
    const ask = () => { if (i >= order.length) return c.end({ stat: lines + ' BINGO' }); busy = false; const q = order[i]; qb.textContent = q.q; c.hud({ progress: `Câu ${i + 1}/${order.length}`, points: 'BINGO: ' + lines }); tm = c.countdown(c.time || 20, tb, () => choose(null)); };
    const choose = k => {
      if (busy) return; busy = true; tm && tm.stop(); const q = order[i++]; const target = cellQ.indexOf(q); const r = k === target;
      c.record(r, q.q, k == null ? '(hết giờ)' : cellQ[k].opts[cellQ[k].ans[0]], q.opts[q.ans[0]]);
      state[target] = r ? 1 : 2; sfx(r ? 'ok' : 'bad'); draw();
      const nl = countLines(); if (nl > lines) { lines = nl; sfx('win'); toast('BINGO! (' + lines + ')'); }
      c.after(c.fb() ? 900 : 400, ask);
    };
    draw(); ask();
  } });

defGame({ id: 'q17', kind: 'q', name: 'Bấm chuông giành quyền', ab: 'BC', team: true, desc: 'Các đội bấm chuông giành quyền trả lời; chơi một mình thì tính điểm tốc độ.', how: 'Đọc câu hỏi, đội nào biết đáp án bấm chuông (phím Q, P, Z, M hoặc nút trên màn hình) để giành quyền trả lời. Sai thì nhường đội khác.',
  play(c) {
    const T = c.teams;
    if (!T) { let pts = 0; return qSeries(c, (q, i, next) => { const t0 = Date.now(); c.askQ(c.arena, q, ok => { if (ok) pts += Math.max(1, Math.round(10 * (1 - (Date.now() - t0) / 1000 / (c.time || 20)))); c.hud({ points: 'Điểm tốc độ ' + pts }); next(); }); }); }
    const keys = ['q', 'p', 'z', 'm'];
    const box = h('div'), bar = h('div', { class: 'row', style: { justifyContent: 'center' } }); c.arena.append(box, bar);
    let cur = null, buzzCur = null;
    c.on(document, 'keydown', e => { const k = keys.indexOf(e.key.toLowerCase()); if (k >= 0 && k < T.length && buzzCur) buzzCur(k); });
    qSeries(c, (q, i, next) => {
      const locked = new Set(); let holder = -1; cur = q;
      const showQ = () => { box.innerHTML = ''; box.append(h('div', { class: 'qtext' }, q.q), h('div', { class: 'legend', style: { marginTop: '12px' } }, q.opts.map((o, k) => h('div', null, 'ABCD'[k] + '. ' + o)))); drawBar(); };
      const drawBar = () => { bar.innerHTML = ''; T.forEach((t, k) => bar.append(h('button', { class: 'sbtn' + (locked.has(k) ? '' : ' go'), disabled: locked.has(k) || holder >= 0, style: { background: locked.has(k) ? '' : COLORS[k], color: '#fff', borderColor: COLORS[k], fontSize: '18px' }, onclick: () => buzz(k) }, `${t.name} (${keys[k].toUpperCase()}) · ${t.score}`))); };
      const buzz = k => {
        if (holder >= 0 || locked.has(k)) return; holder = k; sfx('win'); bar.innerHTML = '';
        c.askQ(box, q, ok => {
          if (ok) { T[k].score++; return next(); }
          locked.add(k); holder = -1;
          if (locked.size >= T.length) return next();
          showQ();
        }, { label: T[k].name + ' giành quyền trả lời', time: 12, norecord: true, keys: false });
      };
      buzzCur = k => { if (cur === q && holder < 0 && box.querySelector('.legend')) buzz(k); };
      showQ();
    });
  } });

defGame({ id: 'q18', kind: 'q', name: 'Sinh tồn 3 mạng', ab: 'ST', desc: 'Thời gian rút ngắn dần, sai 3 lần là kết thúc.', how: 'Em có 3 mạng. Mỗi câu sau thời gian ít hơn câu trước. Trả lời sai hoặc hết giờ mất một mạng.',

defGame({ id: 'q19', kind: 'q', name: 'Ném phi tiêu', ab: 'PT', team: true, desc: 'Trả lời đúng được ném phi tiêu ăn điểm theo vòng bia.', how: 'Trả lời đúng thì được ném một phi tiêu: tâm ngắm chạy qua lại, bấm NÉM đúng lúc để trúng hồng tâm (50 điểm).',
  play(c) {
    const T = c.teams || [{ name: 'Điểm', score: 0 }];
    const throwDart = done => {
      c.arena.innerHTML = ''; const S0 = 300;
      const cv = h('canvas', { width: S0 * 2, height: S0 * 2, style: { width: 'min(80vw,360px)', margin: '0 auto', display: 'block' } }); const x = cv.getContext('2d');
      const rings = [[1, '#2E9B63', 5], [.78, '#F4F7F2', 10], [.56, '#E35D4B', 25], [.3, '#F4F7F2', 25], [.14, '#E35D4B', 50]];
      const tb = h('div'); c.teamBar(tb);
      const btn = h('button', { class: 'sbtn go', style: { fontSize: '22px', padding: '12px 40px' } }, 'NÉM');
      c.arena.append(tb, h('div', { class: 'qtext' }, 'Ném phi tiêu!'), cv, h('div', { style: { textAlign: 'center' } }, btn));
      let t = 0, thrown = false, aim = [0, 0];
      const paint = () => { x.clearRect(0, 0, S0 * 2, S0 * 2); rings.forEach(([r, col]) => { x.beginPath(); x.arc(S0, S0, r * S0 * .95, 0, 7); x.fillStyle = col; x.fill(); }); x.strokeStyle = '#111'; x.lineWidth = 6; x.beginPath(); x.arc(S0 + aim[0], S0 + aim[1], 26, 0, 7); x.moveTo(S0 + aim[0] - 40, S0 + aim[1]); x.lineTo(S0 + aim[0] + 40, S0 + aim[1]); x.moveTo(S0 + aim[0], S0 + aim[1] - 40); x.lineTo(S0 + aim[0], S0 + aim[1] + 40); x.stroke(); };
      c.loop(dt => { if (thrown) return false; t += dt; aim = [Math.sin(t * 2.3) * S0 * .9, Math.sin(t * 3.1 + 1) * S0 * .9]; paint(); });
      const go2 = () => { if (thrown) return; thrown = true; const d = Math.hypot(...aim) / (S0 * .95); let pts = 0; for (const [r, , p] of rings) if (d <= r) pts = p; T[c.turn].score += pts; sfx(pts >= 25 ? 'win' : pts ? 'ok' : 'bad'); x.fillStyle = '#111'; x.beginPath(); x.arc(S0 + aim[0], S0 + aim[1], 10, 0, 7); x.fill(); btn.textContent = '+' + pts + ' điểm'; btn.disabled = true; c.after(1300, done); };
      btn.onclick = go2; c.on(document, 'keydown', e => { if (e.code === 'Space') { e.preventDefault(); go2(); } });
    };
    qSeries(c, (q, i, next) => { if (!c.teams) c.hud({ points: 'Điểm ' + T[0].score }); c.askQ(c.arena, q, ok => { if (ok) throwDart(() => { c.nextTurn(); next(); }); else { c.nextTurn(); next(); } }, { label: c.teams ? 'Lượt: ' + T[c.turn].name : null, nextLabel: 'Tiếp tục' }); });
  } });

defGame({ id: 'q20', kind: 'q', name: 'Giải mã kho báu', ab: 'KB', team: true, desc: 'Câu đúng nhận chìa khóa, mở rương tìm vàng (cẩn thận rương bẫy).', how: 'Trả lời đúng để nhận chìa khóa, rồi chọn một rương để mở. Rương có thể chứa vàng hoặc bẫy trừ điểm.',

/* ===== GHÉP CẶP (8 trò) ===== */
const takePairs = (c, n = 8) => shuffle(c.D.pairsX).slice(0, n);
function picker() { let sel = null; return { set(el, v) { if (sel) sel.el.classList.remove('sel'); if (sel && sel.el === el) { sel = null; return; } sel = { el, v }; el.classList.add('sel'); }, get: () => sel, clear() { if (sel) sel.el.classList.remove('sel'); sel = null; } }; }
function dragable(el, v, onPick) { el.draggable = true; el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', 'x'); onPick(el, v, true); }); }
function dropzone(el, onDrop) { el.addEventListener('dragover', e => e.preventDefault()); el.addEventListener('drop', e => { e.preventDefault(); onDrop(); }); }
function checkBtn(label, fn, again) { return h('div', { style: { textAlign: 'center' } }, h('button', { class: 'sbtn go', onclick: e => { if (!again) { if (e.currentTarget.disabled) return; e.currentTarget.disabled = true; } fn(e); } }, label || 'Kiểm tra')); }

defGame({ id: 'p1', kind: 'pairs', name: 'Nối cặp', ab: 'NC', desc: 'Nối thuật ngữ ở cột trái với định nghĩa ở cột phải.', how: 'Bấm một ô bên trái rồi bấm ô bên phải tương ứng để nối dây. Nối xong bấm Kiểm tra.',
  play(c) {
    const P = takePairs(c), R = shuffle(P.map((_, i) => i)); const link = {};
    const wrap = h('div', { style: { position: 'relative', display: 'grid', gridTemplateColumns: '1fr 1fr', columnGap: '18%', rowGap: '10px', maxWidth: '980px', width: '100%', margin: '0 auto' } });
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('style', 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible');
    let selL = null; const L = [], Rt = [];
    P.forEach((p, i) => {
      const l = h('div', { class: 'tile', style: { gridColumn: 1, gridRow: i + 1 }, onclick: () => { L.forEach(x => x.classList.remove('sel')); selL = i; l.classList.add('sel'); } }, p.a);
      const r = h('div', { class: 'tile', style: { gridColumn: 2, gridRow: i + 1 }, onclick: () => { if (selL == null) return; Object.keys(link).forEach(k => { if (link[k] === R[i]) delete link[k]; }); link[selL] = R[i]; L[selL].classList.remove('sel'); selL = null; sfx('pop'); draw(); } }, P[R[i]].b);
      L.push(l); Rt.push(r); wrap.append(l, r);
    });
    wrap.append(svg);
    const draw = () => { svg.innerHTML = ''; const b = wrap.getBoundingClientRect(); Object.entries(link).forEach(([li, pj]) => { const a = L[li].getBoundingClientRect(), rr = Rt[R.indexOf(pj)].getBoundingClientRect(); const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'); ln.setAttribute('x1', a.right - b.left); ln.setAttribute('y1', a.top + a.height / 2 - b.top); ln.setAttribute('x2', rr.left - b.left); ln.setAttribute('y2', rr.top + rr.height / 2 - b.top); ln.setAttribute('stroke', ln.dataset.c || COLORS[li % 8]); ln.setAttribute('stroke-width', '4'); ln.setAttribute('stroke-linecap', 'round'); ln.dataset.li = li; svg.append(ln); }); };
    c.on(window, 'resize', draw);
    c.arena.append(h('div', { class: 'qtext' }, 'Nối cho đúng'), wrap, checkBtn('Kiểm tra', () => {
      P.forEach((p, i) => { const ok = link[i] === i; c.record(ok, p.a, link[i] != null ? P[link[i]].b : '(chưa nối)', p.b); L[i].classList.add(ok ? 'okc' : 'badc'); });
      svg.querySelectorAll('line').forEach(ln => ln.setAttribute('stroke', link[ln.dataset.li] === +ln.dataset.li ? '#7CF2B0' : '#FF9C8F'));
      sfx('win'); c.after(1800, () => c.end());
    }));
    c.after(50, draw);
  } });

defGame({ id: 'p2', kind: 'pairs', name: 'Lật thẻ trí nhớ', ab: 'LT', team: true, desc: 'Lật hai thẻ úp, tìm thuật ngữ và định nghĩa khớp nhau.', how: 'Mỗi lượt lật 2 thẻ. Nếu thuật ngữ và định nghĩa khớp nhau thì giữ lại. Nhớ vị trí để lật ít lần nhất.',
  play(c) {
    const P = takePairs(c, 8); const T = c.teams;
    const cards = shuffle(P.flatMap((p, i) => [{ i, t: p.a, k: 'a' }, { i, t: p.b, k: 'b' }]));
    let open = [], miss = 0, got = 0, lock = false;
    const grid = h('div', { style: { display: 'grid', gridTemplateColumns: `repeat(${cards.length > 12 ? 4 : 3},1fr)`, gap: '10px', maxWidth: '900px', width: '100%', margin: '0 auto' } });
    const tb = h('div'); c.arena.append(tb, grid); if (T) c.teamBar(tb);
    const els = cards.map((cd, k) => { const el = h('button', { class: 'tile', style: { minHeight: '92px', fontSize: '15px', background: 'linear-gradient(135deg,#2C62C9,#8A55C9)', color: 'transparent' }, onclick: () => flip(k) }, cd.t); grid.append(el); return el; });
    const show = (k, on) => { els[k].style.background = on ? '' : 'linear-gradient(135deg,#2C62C9,#8A55C9)'; els[k].style.color = on ? '' : 'transparent'; };
    const flip = k => {
      if (lock || cards[k].done || open.includes(k)) return; show(k, true); open.push(k); sfx('pop');
      if (open.length < 2) return;
      const [a, b] = open; lock = true;
      if (cards[a].i === cards[b].i && cards[a].k !== cards[b].k) {
        cards[a].done = cards[b].done = true; els[a].classList.add('okc'); els[b].classList.add('okc'); got++; sfx('ok'); c.record(true, P[cards[a].i].a, '', P[cards[a].i].b); if (T) T[c.turn].score++;
        open = []; lock = false; c.hud({ points: `Tìm được ${got}/${P.length}` });
        if (got === P.length) c.after(800, () => c.end({ ratio: P.length / (P.length + miss * .35), stat: miss + ' lần lật nhầm' }));
      } else { miss++; c.after(1000, () => { show(a, false); show(b, false); open = []; lock = false; if (T) { c.nextTurn(); c.teamBar(tb); } }); }
      if (T) c.teamBar(tb);
    };
  } });

defGame({ id: 'p3', kind: 'pairs', name: 'Tìm cặp nhanh', ab: 'TC', desc: 'Mọi thẻ đều mở sẵn, bấm nhanh từng cặp khớp nhau để xóa bảng.', how: 'Bấm một thẻ rồi bấm thẻ khớp với nó. Cặp đúng sẽ biến mất. Xóa hết bảng nhanh nhất có thể!',
  play(c) {
    const P = takePairs(c, 8); let sel = null, mis = 0, got = 0;
    const grid = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(170px,1fr))', gap: '10px' } }); c.arena.append(grid);
    shuffle(P.flatMap((p, i) => [{ i, t: p.a, k: 'a' }, { i, t: p.b, k: 'b' }])).forEach(cd => {
      const el = h('div', { class: 'tile', style: { minHeight: '70px', display: 'grid', placeItems: 'center' }, onclick: () => {
        if (!sel) { sel = { cd, el }; el.classList.add('sel'); return; }
        if (sel.el === el) { el.classList.remove('sel'); sel = null; return; }
        if (sel.cd.i === cd.i && sel.cd.k !== cd.k) { sfx('ok'); sel.el.classList.add('gone'); el.classList.add('gone'); got++; c.record(true, P[cd.i].a, '', P[cd.i].b); c.hud({ points: `${got}/${P.length}` }); if (got === P.length) c.after(500, () => c.end({ ratio: P.length / (P.length + mis * .35), stat: mis + ' lần chọn nhầm' })); }
        else { mis++; sfx('bad'); el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); sel.el.classList.remove('sel'); }
        sel = null;
      } }, cd.t);
      grid.append(el);
    });
  } });

defGame({ id: 'p4', kind: 'pairs', name: 'Thẻ ghi nhớ', ab: 'TG', desc: 'Lật thẻ tự kiểm tra; thẻ chưa nhớ sẽ quay lại.', how: 'Nhìn thuật ngữ, tự nhớ định nghĩa rồi bấm vào thẻ để lật. Tự đánh giá: Đã nhớ hay Chưa nhớ. Thẻ chưa nhớ sẽ xuất hiện lại.',

function buildCross(words) {
  const ws = words.slice().sort((a, b) => b.p.length - a.p.length);
  const grid = new Map(), placed = [];
  const get = (x, y) => grid.get(x + ',' + y);
  const can = (w, x, y, d) => {
    const dx = d ? 0 : 1, dy = d ? 1 : 0;
    if (get(x - dx, y - dy) || get(x + dx * w.length, y + dy * w.length)) return false;
    let cross = 0;
    for (let k = 0; k < w.length; k++) {
      const cx = x + dx * k, cy = y + dy * k, g = get(cx, cy);
      if (g) { if (g !== w[k]) return false; cross++; }
      else if (get(cx + dy, cy + dx) || get(cx - dy, cy - dx)) return false;
    }
    return cross > 0 || !placed.length;
  };
  const put = (wo, x, y, d) => { const dx = d ? 0 : 1, dy = d ? 1 : 0; for (let k = 0; k < wo.p.length; k++) grid.set((x + dx * k) + ',' + (y + dy * k), wo.p[k]); placed.push({ ...wo, x, y, d }); };
  ws.forEach((wo, n) => {
    if (!placed.length) return put(wo, 0, 0, 0);
    const opts = [];
    for (const pw of placed) for (let i = 0; i < pw.p.length; i++) for (let j = 0; j < wo.p.length; j++) if (pw.p[i] === wo.p[j]) {
      const d = pw.d ? 0 : 1; const px = pw.x + (pw.d ? 0 : i), py = pw.y + (pw.d ? i : 0);
      const x = d ? px : px - j, y = d ? py - j : py; if (can(wo.p, x, y, d)) opts.push([x, y, d]);
    }
    if (opts.length) put(wo, ...pick(opts));
  });
  const xs = [...grid.keys()].map(k => +k.split(',')[0]), ys = [...grid.keys()].map(k => +k.split(',')[1]);
  const mx = Math.min(...xs), my = Math.min(...ys);
  placed.forEach(p => { p.x -= mx; p.y -= my; });
  const starts = {}; let num = 0;
  placed.slice().sort((a, b) => a.y - b.y || a.x - b.x).forEach(p => { const k = p.x + ',' + p.y; if (!starts[k]) starts[k] = ++num; p.n = starts[k]; });
  return { placed, w: Math.max(...xs) - mx + 1, h: Math.max(...ys) - my + 1, starts };
}
defGame({ id: 'w2', kind: 'words', name: 'Ô chữ giao nhau', ab: 'OX', min: 4, desc: 'Ô chữ ngang dọc tự sinh từ danh sách từ khóa.', how: 'Bấm vào một ô và gõ chữ cái (không dấu). Bấm lại ô đó để đổi hướng ngang/dọc. Xem gợi ý ở bên cạnh, xong bấm Kiểm tra.',

defGame({ id: 'w3', kind: 'words', name: 'Tìm từ ẩn', ab: 'TT', min: 4, desc: 'Tìm các từ khóa ẩn trong bảng chữ cái theo hàng, cột, đường chéo.', how: 'Bấm chữ cái đầu rồi bấm chữ cái cuối của từ (theo hàng ngang, dọc hoặc chéo). Tìm đủ các từ trong danh sách.',
  play(c) {
    const ws = takeWords(c, 10, 3, 12); const N = clamp(Math.max(...ws.map(w => w.p.length)) + 3, 10, 14);
    const G = Array.from({ length: N }, () => Array(N).fill(''));

    ws.forEach(w => { for (let t = 0; t < 200; t++) { const [dx, dy] = pick(dirs); const x = Math.random() * N | 0, y = Math.random() * N | 0; const ex = x + dx * (w.p.length - 1), ey = y + dy * (w.p.length - 1); if (ex < 0 || ey < 0 || ex >= N || ey >= N) continue; let ok = true; for (let k = 0; k < w.p.length; k++) { const g = G[y + dy * k][x + dx * k]; if (g && g !== w.p[k]) { ok = false; break; } } if (!ok) continue; for (let k = 0; k < w.p.length; k++) G[y + dy * k][x + dx * k] = w.p[k]; placed.push({ ...w, x, y, dx, dy }); break; } });
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!G[y][x]) G[y][x] = pick(LET);
    const found = new Set(); let start = null;
    const cs = `min(${Math.floor(64 / N)}vw,38px)`; const els = [];
    const grid = h('div', { class: 'cells', style: { gridTemplateColumns: `repeat(${N},var(--cs))`, '--cs': cs } });
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const el = h('div', { class: 'cell', style: { cursor: 'pointer' }, onclick: () => tap(x, y) }, G[y][x]); els.push(el); grid.append(el); }
    const list = h('div', { style: { display: 'grid', gap: '6px' } });
    const drawList = () => { list.innerHTML = ''; placed.forEach((p, i) => list.append(h('div', { class: 'tile', style: { textAlign: 'left', cursor: 'default', textDecoration: found.has(i) ? 'line-through' : 'none', opacity: found.has(i) ? .6 : 1 } }, p.w, p.hint ? h('div', { style: { fontSize: '12.5px', color: 'var(--s-dim)', fontWeight: 500 } }, p.hint) : null))); c.hud({ points: `Tìm được ${found.size}/${placed.length}` }); };
    const tap = (x, y) => {
      if (!start) { start = [x, y]; els[y * N + x].classList.add('cur'); return; }
      const [sx, sy] = start; els[sy * N + sx].classList.remove('cur'); start = null;
      const dx = Math.sign(x - sx), dy = Math.sign(y - sy), len = Math.max(Math.abs(x - sx), Math.abs(y - sy)) + 1;

      let s = ''; const path = []; for (let k = 0; k < len; k++) { s += G[sy + dy * k][sx + dx * k]; path.push((sy + dy * k) * N + sx + dx * k); }

      if (i < 0) return sfx('bad');
      found.add(i); sfx('ok'); path.forEach(k => els[k].classList.add('hit')); drawList();
