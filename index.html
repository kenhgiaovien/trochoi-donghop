    const pool = h('div', { class: 'row', style: { justifyContent: 'center' } });
    const draw = () => { slots.forEach((s, k) => { const b = bank.find(x => x.i === fill[k]); s.textContent = b ? b.t : '……'; s.classList.toggle('ph', !b); }); pool.innerHTML = ''; bank.filter(b => !Object.values(fill).includes(b.i)).forEach(b => { const t = h('div', { class: 'tile', onclick: () => pk.set(t, b.i) }, b.t); dragable(t, b.i, (el, v) => { pk.clear(); pk.set(el, v); }); pool.append(t); }); };
    c.arena.append(p, h('div', { style: { textAlign: 'center', color: 'var(--s-dim)' } }, 'Ngân hàng từ'), pool, checkBtn('Kiểm tra', () => { B.forEach((a, k) => { const b = bank.find(x => x.i === fill[k]); const ok = !!b && clozeOK(b.t, a); c.record(ok, 'Chỗ trống ' + (k + 1), b ? b.t : '(trống)', a); slots[k].classList.add(ok ? 'okc' : 'badc'); }); c.after(1800, () => c.end()); }));
    draw();
  } });

defGame({ id: 'c3', kind: 'cloze', name: 'Điền khuyết chọn đáp án', ab: 'CĐ', min: 2, desc: 'Mỗi chỗ trống là một ô chọn, chọn từ thích hợp.', how: 'Ở mỗi chỗ trống, mở danh sách và chọn từ thích hợp. Chọn xong bấm Kiểm tra.',
  play(c) {
    const B = c.D.cloze.blanks; const sels = [];
    const p = h('div', { style: { fontSize: 'clamp(17px,2vw,22px)', lineHeight: 2.2, maxWidth: '980px', margin: '0 auto' } });
    c.D.cloze.parts.forEach(x => { if (typeof x === 'string') p.append(x); else { const opts = shuffle([...new Set([x.blank, ...shuffle(B.filter(b => b !== x.blank)).slice(0, 3)])]); const s = h('select', { style: { width: 'auto', display: 'inline-block', padding: '3px 6px' } }, h('option', { value: '' }, '— chọn —'), opts.map(o => h('option', { value: o }, o))); sels.push([s, x.blank]); p.append(s); } });
    c.arena.append(p, checkBtn('Kiểm tra', () => { sels.forEach(([s, a], k) => { const ok = s.value === a; c.record(ok, 'Chỗ trống ' + (k + 1), s.value || '(trống)', a); s.style.background = ok ? '#7CF2B0' : '#FF9C8F'; s.disabled = true; }); c.after(1800, () => c.end()); }));
  } });

defGame({ id: 'c4', kind: 'cloze', name: 'Tìm lỗi sai', ab: 'TL', min: 2, desc: 'Đoạn văn bị cài từ sai, bấm vào những chỗ sai.', how: 'Đoạn văn có một số từ bị thay sai. Bấm vào các từ/cụm từ em cho là sai (bấm lại để bỏ), rồi bấm Kiểm tra.',
  play(c) {
    const B = c.D.cloze.blanks; const nW = Math.max(1, Math.floor(B.length / 2)); const wrongIdx = new Set(shuffle(B.map((_, i) => i)).slice(0, nW));
    const pool = c.D.words.map(w => w.w).concat(c.D.pairsX.map(x => x.a), B);
    const marks = new Set(); const toks = []; let bi = 0;
    const p = h('div', { style: { fontSize: 'clamp(17px,2vw,22px)', lineHeight: 2.1, maxWidth: '980px', margin: '0 auto' } });
    const tok = (text, info) => { const s = h('span', { style: { cursor: 'pointer', borderRadius: '6px', padding: '1px 3px' }, onclick: () => { const k = toks.indexOf(info); marks.has(k) ? marks.delete(k) : marks.add(k); s.style.background = marks.has(k) ? 'var(--sun)' : ''; s.style.color = marks.has(k) ? '#2A1E00' : ''; } }, text); info.el = s; toks.push(info); return s; };
    c.D.cloze.parts.forEach(x => {
      if (typeof x === 'string') x.split(/(\s+)/).forEach(w => p.append(/\s/.test(w) || !w ? w : tok(w, { wrong: false })));
      else { const k = bi++; let shown = x.blank; if (wrongIdx.has(k)) { const alt = shuffle(pool.filter(w => norm(w) !== norm(x.blank)))[0]; if (alt) shown = alt; else wrongIdx.delete(k); } p.append(tok(shown, { wrong: wrongIdx.has(k), right: x.blank, k })); }
    });
    c.arena.append(h('div', { class: 'qtext', style: { fontSize: '20px' } }, `Có ${wrongIdx.size} chỗ sai trong đoạn văn`), p, checkBtn('Kiểm tra', () => {
      toks.forEach((t, k) => { if (t.wrong) { const ok = marks.has(k); c.record(ok, 'Chỗ sai: ' + t.el.textContent, ok ? 'đã tìm ra' : '(bỏ sót)', t.right); t.el.style.background = ok ? '#23885A' : '#C9473A'; t.el.style.color = '#fff'; if (c.fb()) t.el.textContent += ' → ' + t.right; } else if (marks.has(k)) { c.record(false, 'Đánh dấu nhầm: ' + t.el.textContent, 'đánh dấu sai', '(từ này đúng)'); t.el.style.textDecoration = 'line-through'; } });
      c.after(2400, () => c.end());
    }));
  } });

/* ===== CÔNG CỤ LỚP HỌC (5) ===== */
function namesSource(onChange) {
  const box = h('div', { class: 'row', style: { justifyContent: 'center' } });
  const ta = h('textarea', { id: 'tool-names', placeholder: 'Hoặc dán danh sách tên, mỗi dòng một tên', style: { minHeight: '70px', maxWidth: '420px', color: 'var(--ink)' }, oninput: () => onChange(ta.value.split('\n').map(x => x.trim()).filter(Boolean)) });
  if (S.roster) box.append(h('select', { id: 'tool-cls', style: { maxWidth: '200px', color: 'var(--ink)' }, onchange: e => { if (e.target.value) onChange(S.roster.classes[e.target.value].map(s => s.name)); } }, h('option', { value: '' }, 'Chọn lớp…'), Object.keys(S.roster.classes).sort().map(k => h('option', { value: k }, k))));
  box.append(ta); return box;
}
defGame({ id: 'x1', kind: 'tool', name: 'Gọi tên ngẫu nhiên', ab: 'GT', min: 0, desc: 'Quay ngẫu nhiên tên học sinh để gọi trả lời.', how: 'Chọn lớp (hoặc dán danh sách tên) rồi bấm QUAY. Có thể bật chế độ không gọi lại người đã gọi.',
  play(c) {
    c.noClock = true; let names = [], called = new Set(), noRep = true;
    const big = h('div', { class: 'big', style: { fontSize: 'clamp(34px,6vw,72px)', textAlign: 'center', minHeight: '1.2em' } }, '—');
    const hist = h('div', { style: { color: 'var(--s-dim)', textAlign: 'center' } });
    const spin = () => { const pool = names.filter(n => !noRep || !called.has(n)); if (!pool.length) { toast(names.length ? 'Đã gọi hết, bấm Làm mới' : 'Chưa có danh sách tên'); return; } let k = 0; const winner = pick(pool); const stop = c.every(70, () => { big.textContent = pick(names); sfx('spin'); if (++k > 25) { stop(); big.textContent = winner; called.add(winner); sfx('win'); hist.textContent = 'Đã gọi: ' + [...called].join(', '); } }); };
    c.arena.append(namesSource(n => { names = n; called.clear(); hist.textContent = n.length + ' tên'; }), big,
      h('div', { class: 'row', style: { justifyContent: 'center' } }, h('button', { class: 'sbtn go', style: { fontSize: '22px', padding: '12px 40px' }, onclick: spin }, 'QUAY'), h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: true, onchange: e => noRep = e.target.checked }), 'Không gọi lại'), h('button', { class: 'sbtn', onclick: () => { called.clear(); hist.textContent = ''; } }, 'Làm mới')), hist);
  } });
defGame({ id: 'x2', kind: 'tool', name: 'Chia nhóm ngẫu nhiên', ab: 'CN', min: 0, desc: 'Chia lớp thành các nhóm đều nhau một cách ngẫu nhiên.', how: 'Chọn lớp hoặc dán danh sách tên, chọn số nhóm rồi bấm CHIA NHÓM.',
  play(c) {
    c.noClock = true; let names = [], n = 4; const out = h('div', { class: 'legend' });
    c.arena.append(namesSource(x => names = x), h('div', { class: 'row', style: { justifyContent: 'center' } }, 'Số nhóm', h('input', { type: 'number', id: 'tool-n', min: 2, max: 12, value: n, style: { width: '80px', color: 'var(--ink)' }, oninput: e => n = clamp(+e.target.value || 2, 2, 12) }),
      h('button', { class: 'sbtn go', onclick: () => { if (!names.length) return toast('Chưa có danh sách tên'); const sh = shuffle(names); const g = Array.from({ length: n }, () => []); sh.forEach((x, k) => g[k % n].push(x)); out.innerHTML = ''; g.forEach((m, k) => out.append(h('div', { style: { borderTop: '4px solid ' + COLORS[k % 8] } }, h('b', null, 'Nhóm ' + (k + 1) + ` (${m.length})`), h('div', { style: { fontWeight: 500, fontSize: '14px' } }, m.join(', '))))); sfx('win'); } }, 'CHIA NHÓM')), out);
  } });
defGame({ id: 'x3', kind: 'tool', name: 'Bảng điểm đội và đồng hồ', ab: 'BĐ', min: 0, desc: 'Cộng trừ điểm cho các đội và bấm giờ hoạt động.', how: 'Cộng/trừ điểm từng đội khi chơi trò chơi ngoài máy. Đặt số phút và bấm Bắt đầu để đếm ngược.',
  play(c) {
    c.noClock = true; const teams = ['Đội 1', 'Đội 2', 'Đội 3', 'Đội 4'].map(n => ({ n, s: 0 }));
    const board = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: '12px' } });
    const draw = () => { board.innerHTML = ''; teams.forEach((t, k) => board.append(h('div', { style: { background: 'var(--s-tile)', borderRadius: '14px', padding: '14px', textAlign: 'center', borderTop: '6px solid ' + COLORS[k] } }, h('input', { value: t.n, style: { textAlign: 'center', fontWeight: 800, color: 'var(--ink)' }, oninput: e => t.n = e.target.value }), h('div', { class: 'big' }, t.s), h('div', { class: 'row', style: { justifyContent: 'center' } }, [-1, 1, 5, 10].map(v => h('button', { class: 'sbtn', onclick: () => { t.s += v; sfx(v > 0 ? 'ok' : 'bad'); draw(); } }, (v > 0 ? '+' : '') + v)))))); };
    let left = 300, run = false; const clk = h('div', { class: 'big', style: { textAlign: 'center' } }, fmtTime(left));
    c.every(1000, () => { if (run && left > 0) { left--; clk.textContent = fmtTime(left); if (left <= 5 && left > 0) sfx('tick'); if (!left) { run = false; sfx('win'); toast('Hết giờ!'); } } });
    c.arena.append(clk, h('div', { class: 'row', style: { justifyContent: 'center' } }, h('input', { type: 'number', id: 'tool-min', min: 1, max: 90, value: 5, style: { width: '80px', color: 'var(--ink)' }, oninput: e => { left = (+e.target.value || 1) * 60; clk.textContent = fmtTime(left); } }), 'phút', h('button', { class: 'sbtn go', onclick: () => run = true }, 'Bắt đầu'), h('button', { class: 'sbtn', onclick: () => run = false }, 'Tạm dừng')), board);
    draw();
  } });
defGame({ id: 'x4', kind: 'tool', name: 'Bốc thăm câu hỏi', ab: 'BT', min: 0, desc: 'Rút ngẫu nhiên một câu hỏi trong bài để hỏi miệng.', how: 'Bấm BỐC THĂM để rút một câu hỏi ngẫu nhiên của bài đang chọn. Bấm Xem đáp án khi học sinh trả lời xong.',
  play(c) {
    c.noClock = true; let pool = shuffle(c.D.q); const card = h('div', { class: 'qcard' });
    const draw = () => { card.innerHTML = ''; if (!c.D.q.length) { card.append(h('div', { class: 'qtext' }, 'Bài này chưa có câu trắc nghiệm.')); return; } if (!pool.length) pool = shuffle(c.D.q); const q = pool.pop(); const ansBox = h('div'); card.append(h('div', { class: 'qtext pop' }, q.q), h('div', { class: 'legend' }, q.opts.map((o, k) => h('div', null, 'ABCD'[k] + '. ' + o))), ansBox, h('div', { style: { textAlign: 'center' } }, h('button', { class: 'sbtn', onclick: () => { ansBox.innerHTML = ''; ansBox.append(h('div', { class: 'explain' }, 'Đáp án: ' + q.ans.map(a => q.opts[a]).join('; ') + (q.ex ? ' — ' + q.ex : ''))); } }, 'Xem đáp án'))); sfx('pop'); };
    c.arena.append(h('div', { style: { textAlign: 'center' } }, h('button', { class: 'sbtn go', style: { fontSize: '22px', padding: '12px 40px' }, onclick: draw }, 'BỐC THĂM')), card);
  } });
defGame({ id: 'x5', kind: 'tool', name: 'Xúc xắc', ab: 'XX', min: 0, desc: 'Tung 1 đến 3 viên xúc xắc cho trò chơi trên lớp.', how: 'Chọn số viên rồi bấm TUNG.',
  play(c) {
    c.noClock = true; let n = 2; const out = h('div', { class: 'row', style: { justifyContent: 'center', gap: '16px' } });
    const face = v => { const dots = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] }[v]; return h('div', { style: { width: '110px', height: '110px', background: '#fff', borderRadius: '18px', display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', padding: '14px', gap: '4px' } }, [1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => h('span', { style: { borderRadius: '50%', background: dots.includes(k) ? '#1A2238' : 'transparent' } }))); };
    const roll = () => { let k = 0; const st = c.every(70, () => { out.innerHTML = ''; const vs = Array.from({ length: n }, () => 1 + (Math.random() * 6 | 0)); vs.forEach(v => out.append(face(v))); sfx('tick'); if (++k > 12) { st(); out.append(h('div', { class: 'big', style: { alignSelf: 'center' } }, '= ' + vs.reduce((a, b) => a + b, 0))); } }); };
    c.arena.append(h('div', { class: 'row', style: { justifyContent: 'center' } }, [1, 2, 3].map(v => h('button', { class: 'sbtn' + (v === n ? ' go' : ''), onclick: e => { n = v; e.target.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('go', b === e.target)); } }, v + ' viên')), h('button', { class: 'sbtn go', style: { fontSize: '20px', padding: '10px 36px' }, onclick: roll }, 'TUNG')), out);
  } });

boot();
